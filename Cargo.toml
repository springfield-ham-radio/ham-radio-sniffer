[package]
name = "ham-radio-sniffer"
version = "0.1.0"
description = "Headless serial bridge for ham radio clone protocols"
authors = ["Bryan Hunt"]
license = "MIT"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/springfield-ham-radio/ham-radio-sniffer"

[[bin]]
name = "ham-radio-sniffer"
path = "src/main.rs"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ctrlc = "3.5"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "=4.10.1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
